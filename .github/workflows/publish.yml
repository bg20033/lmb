name: Publiko lajme

on:
  schedule:
    # Every 2 hours from 05:07 to 21:07 UTC  (≈ 07:07–23:07 in Kosovo during summer time).
    - cron: "7 5-21/2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Çka me bo"
        type: choice
        default: licensed-copy
        options:
          - discover   # PROVË PA AI: lexon portalet, grupon lajmet, lexon tekstet — s'shkruan asgjë
          - test       # PROVË PA AI: shkruan artikuj TEST në kopje të faqeve, i ndërton + SEO audit — NUK publikon
          - dry-run    # ME AI: Claude shkruan artikuj të vërtetë, i sheh të plotë në Summary — NUK publikon
          - publish    # ME AI: publikon në faqe (kjo punon vetë çdo 2 orë)
          - licensed-copy # PA AI: publikon tekstin e plotë të burimit të licencuar, me atribim + link
      max_stories:
        description: "Sa histori (bosh = sipas config/bot.json)"
        required: false
        default: ""
      model:
        description: "Modeli për këtë ekzekutim (bosh = sipas config), p.sh. deepseek/deepseek-v4.1-flash"
        required: false
        default: ""

# Never run two jobs at the same time.
concurrency:
  group: lajme-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || 'licensed-copy' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOT: dotnet bin/bot/LajmeBot.dll
    steps:
      - name: Checkout bot
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build bot
        run: dotnet build src/LajmeBot -c Release -o bin/bot --nologo -v quiet

      - name: Self-test
        run: $BOT selftest

      # Until the secrets are set, scheduled runs end quietly instead of failing every 2 hours.
      - name: Check secrets
        id: gate
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          go=true
          if [ "$MODE" = "publish" ] || [ "$MODE" = "dry-run" ]; then
            if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::notice::Mungon çelësi i AI (OPENROUTER_API_KEY ose ANTHROPIC_API_KEY) — '$MODE' u anashkalua. Provo mode 'discover' ose 'test' (pa AI)."; go=false
            fi
          fi
          if { [ "$MODE" = "publish" ] || [ "$MODE" = "licensed-copy" ]; } && [ -z "$SITES_TOKEN" ]; then
            echo "::notice::SITES_TOKEN mungon — publikimi u anashkalua."; go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

      # ---------------- discover: live test of the reading side, no AI, no sites ----------------
      - name: Discover (pa AI)
        if: steps.gate.outputs.go == 'true' && env.MODE == 'discover'
        run: |
          $BOT discover --top 5 --report out/discover.md
          cat out/discover.md >> "$GITHUB_STEP_SUMMARY"

      # ---------------- everything below needs the site checkouts ----------------
      - name: Checkout sites
        if: steps.gate.outputs.go == 'true' && env.MODE != 'discover'
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          if [ -z "$SITES_TOKEN" ] && { [ "$MODE" = "publish" ] || [ "$MODE" = "licensed-copy" ]; }; then
            echo "::error::Secret SITES_TOKEN mungon (GitHub token me qasje Contents: write në repo-t e faqeve)"; exit 1
          fi
          mkdir -p sites
          $BOT sites | while read -r slug repo branch; do
            if [ -n "$SITES_TOKEN" ]; then url="https://x-access-token:${SITES_TOKEN}@github.com/${repo}.git"; else url="https://github.com/${repo}.git"; fi
            echo "Cloning $repo ($branch) -> sites/$slug"
            git clone --quiet --depth 20 --branch "$branch" "$url" "sites/$slug" \
              || echo "::warning::Nuk u klonua $repo — faqja $slug anashkalohet (repo privat pa SITES_TOKEN, ose s'ekziston)"
          done
          ls sites

      - name: Setup Node
        if: steps.gate.outputs.go == 'true' && (env.MODE == 'test' || env.MODE == 'publish' || env.MODE == 'licensed-copy')
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Write articles
        if: steps.gate.outputs.go == 'true' && env.MODE != 'discover'
        env:
          IN_MAX: ${{ inputs.max_stories }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          ARGS="--sites-root sites --summary out/summary.json"
          MAX="$(printf '%s' "$IN_MAX" | tr -d '[:space:]')"
          MODEL="$(printf '%s' "$IN_MODEL" | tr -d '[:space:]')"
          if [ -n "$MAX" ]; then
            if [[ "$MAX" =~ ^[0-9]+$ ]]; then ARGS="$ARGS --max-stories $MAX"
            else echo "::warning::max_stories duhet të jetë numër (p.sh. 2), jo '$MAX' — u injorua"; MAX=""; fi
          fi
          if [ -n "$MODEL" ]; then
            if [[ "$MODEL" == */* ]]; then ARGS="$ARGS --model $MODEL"
            else echo "::warning::model duhet të duket si 'google/gemini-3.8-flash', jo '$MODEL' — u përdor modeli nga config"; fi
          fi
          case "$MODE" in
            test)    ARGS="$ARGS --mock-ai --state out/test-state.json" ;;   # real bot memory stays untouched
            licensed-copy) ARGS="$ARGS --licensed-copy" ;;
            dry-run)
              ARGS="$ARGS --dry-run --drafts-dir out/drafts"
              [ -z "$MAX" ] && ARGS="$ARGS --max-stories 1"   # a test should be cheap
              ;;
          esac
          $BOT run $ARGS

      - name: Build and check every changed site (push only in publish mode)
        if: steps.gate.outputs.go == 'true' && (env.MODE == 'test' || env.MODE == 'publish' || env.MODE == 'licensed-copy')
        run: |
          failed=0
          for dir in sites/*/; do
            slug=$(basename "$dir")
            pushd "$dir" > /dev/null
            if [ -z "$(git status --porcelain)" ]; then echo "$slug: asgjë e re"; popd > /dev/null; continue; fi
            if [ "$slug" = "lajme-per-kosove" ]; then
              count=$(git diff --unified=0 -- src/data/importedArticles.json | grep -c '^+    "id": "imported-' || true)
              verify='npm ci --no-audit --no-fund && npm run build'
              add_paths='src/data/importedArticles.json'
            else
              count=$(git status --porcelain -- src/content/news | grep -c '\.md$' || true)
              verify='npm ci --no-audit --no-fund && npm run build && npm run audit:seo'
              add_paths='src/content src/assets'
            fi
            echo "::group::$slug — build ($count artikuj të rinj)"
            if eval "$verify"; then
              echo "::endgroup::"
              if [ "$MODE" = "publish" ] || [ "$MODE" = "licensed-copy" ]; then
                git add -A $add_paths
                msg="Lajme automatike: $count artikuj të rinj"; [ "$count" = "0" ] && msg="LajmeBot: përditësim"
                git -c user.name="Bardh Gashi" -c user.email="bardhgjeki@gmail.com" commit --quiet -m "$msg"
                git push --quiet origin HEAD && echo "$slug: u publikuan $count artikuj" || { echo "::error::$slug: push dështoi"; failed=1; }
              else
                echo "$slug: ✅ $count artikuj TEST u ndërtuan pa gabime (nuk u publikuan)"
                echo "- **$slug**: ✅ $count artikuj test, build + SEO audit OK" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::endgroup::"
              echo "::error::$slug: build ose SEO audit dështoi — artikujt NUK u publikuan"
              echo "- **$slug**: ❌ build ose SEO audit dështoi" >> "$GITHUB_STEP_SUMMARY"
              git reset --hard --quiet && git clean -fdq
              failed=1
            fi
            popd > /dev/null
          done
          exit $failed

      - name: Show one test article
        if: steps.gate.outputs.go == 'true' && env.MODE == 'test'
        run: |
          f=$(ls -t sites/*/src/content/news/test-*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            { echo; echo "### Shembull: $f"; echo '```markdown'; head -40 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show dry-run drafts
        if: steps.gate.outputs.go == 'true' && env.MODE == 'dry-run'
        run: |
          shopt -s nullglob
          files=(out/drafts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "### Asnjë draft — arsyet janë te \"Probleme / paralajmërime\" më poshtë" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "## Draft-et nga Claude (${#files[@]}) — NUK u publikuan" >> "$GITHUB_STEP_SUMMARY"
          echo "Ilustrimet i gjen te **Artifacts → drafts** në fund të kësaj faqeje." >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            title=$(grep -m1 '^title:' "$f" | sed 's/^title: *//; s/^"//; s/"$//')
            { echo; echo "<details><summary><b>$(basename "$f" .md | sed 's/--.*//')</b>: $title</summary>"; echo; echo '```markdown'; cat "$f"; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload drafts
        if: steps.gate.outputs.go == 'true' && env.MODE == 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: drafts
          path: out/drafts
          if-no-files-found: ignore

      - name: Save bot memory (state/state.json)
        if: always() && steps.gate.outputs.go == 'true' && (env.MODE == 'publish' || env.MODE == 'licensed-copy')
        run: |
          if [ -n "$(git status --porcelain state)" ]; then
            git add state
            git -c user.name="Bardh Gashi" -c user.email="bardhgjeki@gmail.com" commit --quiet -m "Bot state"
            if ! git push --quiet; then
              # A code push while this job is running can make the state-only commit stale.
              # The next scheduled run can safely rebuild the memory; do not fail publishing.
              echo "::warning::Bot state was not pushed because main changed during this run; it will retry next run."
            fi
          fi

      - name: Summary
        if: always() && steps.gate.outputs.go == 'true' && env.MODE != 'discover'
        run: |
          if [ ! -f out/summary.json ]; then
            echo "### ⚠️ Bot-i ndaloi para se me e shkru raportin — shiko log-un e hapit 'Write articles'" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          s = json.load(open("out/summary.json"))
          arts = s.get("articles", [])
          print(f"### Raporti i bot-it ({os.environ.get('MODE')})")
          print(f"- Lajme të lexuara nga portalet: **{s.get('discoveredItems', 0)}**")
          print(f"- Histori të reja: **{s.get('candidateStories', 0)}**")
          for c in s.get("topCandidates", []):
              print(f"  - {c}")
          print(f"- Artikuj të publikuar: **{len(arts)}**")
          for a in arts:
              print(f"  - **{a['Site']}**: {a['Title']} (`/{a['Category']}/{a['Slug']}`)")
          probs = s.get("problems", [])
          if probs:
              print(f"\n<details><summary><b>Probleme / paralajmërime ({len(probs)})</b></summary>\n")
              for p in probs:
                  print(f"- {p}")
              print("\n</details>")
          PY
